[run]
timestep = 0.02

[[run.stop]]
when = "journal"
type = "possession_change"
possessed_by = { team = "A", number = 1 }

[[run.stop]]
when = "time"
time = 6.0

[expect]
journal_match = "subsequence"

[expect.stop]
when = "journal"
type = "possession_change"
possessed_by = { team = "A", number = 1 }

[[expect.journal]]
type = "decision_assigned"
player = { team = "A", number = 1 }
decision = "Run"
reason = "chase_ball"
target = { kind = "point", point = { x = 36.4, y = 0, z = 43.2 } }

[[expect.journal]]
type = "possession_change"
possessed_by = { team = "A", number = 1 }
last_possessing_team = "A"
