[run]
timestep = 0.02

[[run.stop]]
when = "event"
event = "Touchline"
team = "A"

[[run.stop]]
when = "steps"
steps = 1000

[expect]
journal_match = "subsequence"

[expect.stop]
when = "event"
event = "Touchline"
team = "A"

[[expect.journal]]
type = "football_event"
event = "Touchline"
team = "A"

[[expect.journal]]
type = "decisions_reset"

[[expect.journal]]
type = "restart_set"
position = { x = 68.156, y = 0, z = 20 }
team = "B"

[[expect.journal]]
type = "stage_change"
stage = "Setup"
setup_reason = "throw in"
