[run]
timestep = 0.02

[[run.stop]]
when = "time"
time = 2.0

[[run.stop]]
when = "steps"
steps = 1000

[expect]
journal_match = "subsequence"

[expect.stop]
when = "time"
time = 2.0

[[expect.journal]]
type = "decision_assigned"
player = { team = "B", number = 1 }
decision = "Run"
reason = "symmetry:point"
target = { kind = "point", point = { x = 58, y = 0, z = 84.61538 } }

[[expect.journal]]
type = "decision_assigned"
player = { team = "B", number = 2 }
decision = "Run"
reason = "symmetry:cell"
target = { kind = "cell", cell = "Z40" }

[[expect.journal]]
type = "decision_assigned"
player = { team = "B", number = 3 }
decision = "Run"
reason = "symmetry:region"
target = { kind = "region", region = "Y39:Z40" }

[[expect.journal]]
type = "decision_assigned"
player = { team = "B", number = 4 }
decision = "Kick"
reason = "symmetry:kick"
target = { kind = "point", point = { x = 58, y = 0, z = 84.61538 } }
